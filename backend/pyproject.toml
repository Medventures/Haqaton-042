[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "medhub-backend"
version = "0.1.0"
description = "Consultation workflow and frontend contract for Haqaton-042"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1",
  "psycopg[binary]==3.2.13", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
